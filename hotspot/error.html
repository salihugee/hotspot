<html>
<head>
<title>Deens Hotspot &gt; error</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style type="text/css">
body {
	background: #f2f6fb;
	color: #17345b;
	font-family: Arial, Helvetica, sans-serif;
	font-size: 14px;
	margin: 0;
	padding: 28px 14px;
}
a, a:link, a:visited, a:active { color: #0878d1; text-decoration: none; }
a:hover { text-decoration: underline; }
img { border: 0; max-width: 100%; height: auto; }
.page-shell { max-width: 440px; margin: 8vh auto; }
.card {
	background: #ffffff;
	border: 1px solid #d8e4f0;
	border-radius: 14px;
	box-shadow: 0 8px 28px rgba(18, 53, 94, 0.10);
	padding: 28px 26px 24px;
	text-align: center;
}
.brand { display: inline-block; margin: 0 auto 20px; }
.error-title { color: #b43d32; font-size: 20px; font-weight: bold; margin-bottom: 12px; }
.error-message { background: #fff0ed; border-radius: 7px; color: #92342d; line-height: 1.5; margin-bottom: 18px; overflow-wrap: anywhere; padding: 12px; }
.login-link { display: inline-block; font-weight: bold; }
@media (max-width: 360px) {
	.card { padding: 22px 16px; }
}
</style>
</head>
<body>
<div class="page-shell">
	<div class="card">
		<a class="brand" href="http://www.mikrotik.com" target="_blank"><img src="/img/logobottom.png" alt="mikrotik" /></a>
		<div class="error-title">Hotspot ERROR</div>
		<div class="error-message">$(error)</div>
		<a class="login-link" href="$(link-login)">Login page: $(link-login)</a>
	</div>
</div>
</body>
</html>
