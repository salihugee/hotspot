<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
   "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
<title>Deens Hotspot &gt; login</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="-1" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<style type="text/css">
body {
	background: #f2f6fb;
	color: #17345b;
	font-family: Arial, Helvetica, sans-serif;
	font-size: 14px;
	margin: 0;
	padding: 28px 14px;
}

a, a:link, a:visited, a:active {
	color: #0878d1;
	text-decoration: none;
}
a:hover { text-decoration: underline; }
img { border: 0; max-width: 100%; height: auto; }

.page-shell { max-width: 420px; margin: 0 auto; }
.language { text-align: right; margin: 0 4px 12px; font-size: 12px; }
.card {
	background: #ffffff;
	border: 1px solid #d8e4f0;
	border-radius: 14px;
	box-shadow: 0 8px 28px rgba(18, 53, 94, 0.10);
	padding: 28px 26px 24px;
	text-align: center;
}
.brand { display: inline-block; margin: 0 auto 20px; }
.notice { color: #526982; line-height: 1.6; margin-bottom: 22px; }
.notice a { color: #158e55; font-weight: bold; }
.login-fields { border-collapse: separate; border-spacing: 0 10px; margin: 0 auto; text-align: left; width: 100%; }
.login-fields td { color: #17345b; font-size: 14px; padding: 0 5px; }
.login-fields td:first-child { font-weight: bold; white-space: nowrap; }
input[type="text"], input[type="password"] {
	background: #f7faff;
	border: 1px solid #c8d7e8;
	border-radius: 7px;
	box-sizing: border-box;
	color: #17345b;
	font-size: 15px;
	padding: 11px 12px;
	width: 100%;
}
input[type="submit"] {
	background: #0878d1;
	border: 0;
	border-radius: 7px;
	color: #ffffff;
	cursor: pointer;
	font-size: 15px;
	font-weight: bold;
	padding: 11px 24px;
}
.submit-cell { text-align: right; }
.powered { color: #7589a0; font-size: 11px; margin-top: 16px; text-align: center; }
.error { background: #fff0ed; border-radius: 7px; color: #b43d32; font-size: 13px; margin-top: 15px; padding: 10px; }
@media (max-width: 360px) {
	.card { padding: 22px 16px; }
}
</style>
</head>

<body>
$(if chap-id)
	<form name="sendin" action="$(link-login-only)" method="post">
		<input type="hidden" name="username" />
		<input type="hidden" name="password" />
		<input type="hidden" name="dst" value="$(link-orig)" />
		<input type="hidden" name="popup" value="true" />
	</form>
	
	<script type="text/javascript" src="/md5.js"></script>
	<script type="text/javascript">
	<!--
	    function doLogin() {
		document.sendin.username.value = document.login.username.value;
		document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
		document.sendin.submit();
		return false;
	    }
	//-->
	</script>
$(endif)

<div class="page-shell">
	<div class="language">
		<a href="$(link-login-only)?target=lv&amp;dst=$(link-orig-esc)">Latviski</a>
	</div>
	<div class="card">
		<a class="brand" href="http://deens.hotspot" target="_blank"><img src="/img/logobottom.png" alt="Deens" /></a>
		<div class="notice">Please log on to use the internet hotspot service<br />$(if trial == 'yes')Free trial available, <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">click here</a>.$(endif)</div>
		<form name="login" action="$(link-login-only)" method="post"
		    $(if chap-id) onSubmit="return doLogin()" $(endif)>
			<input type="hidden" name="dst" value="$(link-orig)" />
			<input type="hidden" name="popup" value="true" />
			<table class="login-fields">
				<tr><td align="right">login</td>
					<td><input name="username" type="text" value="$(username)"/></td>
				</tr>
				<tr><td align="right">password</td>
					<td><input name="password" type="password"/></td>
				</tr>
				<tr><td>&nbsp;</td>
					<td class="submit-cell"><input type="submit" value="OK" /></td>
				</tr>
			</table>
		</form>
		$(if error)<div class="error">$(error)</div>$(endif)
	</div>
	<div class="powered">Powered by MikroTik RouterOS</div>
</div>

<script type="text/javascript">
<!--
  document.login.username.focus();
//-->
</script>
</body>
</html>
