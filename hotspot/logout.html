<html>
<head>
<title>Deens Hotspot &gt; logout</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style type="text/css">
body {
	background: #f2f6fb;
	color: #17345b;
	font-family: Arial, Helvetica, sans-serif;
	font-size: 14px;
	margin: 0;
	padding: 28px 14px;
}
a, a:link, a:visited, a:active { color: #0878d1; text-decoration: none; }
a:hover { text-decoration: underline; }
img { border: 0; max-width: 100%; height: auto; }
input[type="submit"] {
	background: #0878d1;
	border: 0;
	border-radius: 7px;
	color: #ffffff;
	cursor: pointer;
	font-size: 15px;
	font-weight: bold;
	padding: 11px 24px;
}
.page-shell { max-width: 440px; margin: 0 auto; }
.card {
	background: #ffffff;
	border: 1px solid #d8e4f0;
	border-radius: 14px;
	box-shadow: 0 8px 28px rgba(18, 53, 94, 0.10);
	padding: 28px 26px 24px;
	text-align: center;
}
.brand { display: inline-block; margin: 0 auto 18px; }
.page-title { color: #17345b; font-size: 20px; font-weight: bold; margin: 0 0 20px; }
.details { border-collapse: collapse; margin: 0 auto 20px; text-align: left; width: 100%; }
.details td { border-bottom: 1px solid #e7eef6; font-size: 13px; padding: 11px 8px; }
.details tr:last-child td { border-bottom: 0; }
.details td:first-child { color: #60758d; font-weight: bold; }
.details td:last-child { color: #17345b; text-align: right; }
@media (max-width: 360px) {
	.card { padding: 22px 16px; }
	.details td { padding: 9px 5px; }
}
</style>
</head>

<body>
<script language="JavaScript">
<!--
    function openLogin() {
	if (window.name != 'hotspot_logout') return true;
	open('$(link-login)', '_blank', '');
	window.close();
	return false;
    }
//-->
</script>

<div class="page-shell">
	<div class="card">
		<a class="brand" href="http://www.mikrotik.com" target="_blank"><img src="/img/logobottom.png" alt="mikrotik" /></a>
		<div class="page-title">you have just logged out</div>
		<table class="details">
			<tr><td>user name</td><td>$(username)</td></tr>
			<tr><td>IP address</td><td>$(ip)</td></tr>
			<tr><td>MAC address</td><td>$(mac)</td></tr>
			<tr><td>session time</td><td>$(uptime)</td></tr>
			$(if session-time-left)
			<tr><td>time left</td><td>$(session-time-left)</td></tr>
			$(endif)
			<tr><td>bytes up/down:</td><td>$(bytes-in-nice) / $(bytes-out-nice)</td></tr>
		</table>
		<form action="$(link-login)" name="login" onSubmit="return openLogin()">
			<input type="submit" value="log in">
		</form>
	</div>
</div>
</body>
</html>
